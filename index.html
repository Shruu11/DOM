<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter Program</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f8ff;
    }

    #container {
      width: 350px;
      padding: 30px;
      background-color: skyblue;
      border-radius: 20px;
      text-align: center;
    }

    h3 {
      margin-bottom: 20px;
    }

    #count-variable {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
    }

    #increase {
      background-color: #2ecc71;
      color: white;
    }

    #decrease {
      background-color: #e74c3c;
      color: white;
    }

    #reset {
      background-color: #34495e;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <div id="container">
    <h3>Counter Program</h3>
    <p id="count-variable">0</p>

    <div class="btn-group">
      <button id="increase">Increase</button>
      <button id="reset">Reset</button>
      <button id="decrease">Decrease</button>
    </div>
  </div>

  <script>
    let count = 0;
    const countVariable = document.querySelector("#count-variable");

    document.querySelector("#increase").addEventListener("click", () => {
      count++;
      countVariable.textContent = count;
    });

    document.querySelector("#decrease").addEventListener("click", () => {
      if (count > 0) {
        count--;
        countVariable.textContent = count;
      }
    });

    document.querySelector("#reset").addEventListener("click", () => {
      count = 0;
      countVariable.textContent = count;
    });
  </script>
</body>
</html>
